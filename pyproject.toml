[project]
name = "sheets_sync"
authors = [
    { name = "Gavin D'souza", email = "gavin18d@gmail.com"}
]
description = "Sync data from Remote Sheets to your DocTypes"
requires-python = ">=3.9"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe -- https://github.com/frappe/frappe is installed via 'bench init'

    # Core dependencies
    "gspread>=6.0,<7",
    "croniter~=1.3",
    "cron-descriptor~=1.2.35",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.bench.frappe-dependencies]
frappe = ">=13.0.0,<17.0.0"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501", "E711", "E712", "B007", "B009", "B010", "B023", "F403", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["sheets_sync"]

[tool.weg]
# Compatibility - which Frappe versions does this app support?
[tool.weg.compatibility]
frappe = ["15", "16", "develop"]
databases = ["mariadb"]

# Development environment settings
[tool.weg.dev]
frappe = "15"
database = "mariadb"
