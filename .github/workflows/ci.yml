name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: "13", python-version: "3.9", node-version: "14", frappe-branch: "version-13"}
          - {version: "14", python-version: "3.10", node-version: "16", frappe-branch: "version-14"}
          - {version: "15", python-version: "3.11", node-version: "18", frappe-branch: "version-15"}
          - {version: "16", python-version: "3.14", node-version: "24", frappe-branch: "version-16"}
          - {version: "develop", python-version: "3.14", node-version: "24", frappe-branch: "develop"}

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Frappe bench
        run: pip install frappe-bench

      - name: Initialize bench
        env:
          BENCH_USE_UV: 'true'
        run: |
          bench init --skip-redis-config-generation --skip-assets frappe-bench --frappe-branch ${{ matrix.frappe-branch }}
          if [ "${{ matrix.version }}" = "15" ]; then
            frappe-bench/env/bin/pip install "setuptools<81"
          fi
          cd frappe-bench
          bench get-app ${{ github.workspace }}

      - name: Align MariaDB server settings (frappe 13)
        if: matrix.version == '13'
        working-directory: frappe-bench
        run: |
          env/bin/python - <<'PY'
          import pymysql
          conn = pymysql.connect(host="127.0.0.1", port=3306, user="root", password="root", autocommit=True)
          with conn.cursor() as cur:
              cur.execute("SET GLOBAL character_set_server = 'utf8mb4'")
              cur.execute("SET GLOBAL collation_server = 'utf8mb4_unicode_ci'")
          PY

      - name: Create test site
        working-directory: frappe-bench
        env:
          CI: 'Yes'
        run: |
          bench setup requirements --dev
          bench new-site --mariadb-root-password root --admin-password admin test.localhost
          bench --site test.localhost install-app sheets_sync

      - name: Run tests
        working-directory: frappe-bench
        env:
          CI: 'Yes'
        run: |
          cd sites && ../env/bin/gunicorn -b 127.0.0.1:8000 -w 4 -t 120 frappe.app:application --preload &
          bench --site test.localhost run-tests --app sheets_sync
